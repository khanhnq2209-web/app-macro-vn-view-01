<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản mẫu Scorecard v3</title>
<style>
:root{
  --bg:#fff;--surf:#f6f8fa;--ink:#1a2128;--ink2:#4a5660;--mut:#6b7780;--line:#e1e6ea;--accent:#2a78d6;--warn-bg:#fdf3dc;--warn:#8a5a00;
  --sg-bg:#d3ebdc;--sg:#1b5e20;--g-bg:#e3f1e8;--g:#2e7d32;--y-bg:#fbefd3;--y:#9a6700;--o-bg:#fde8d7;--o:#c25e00;--r-bg:#fbe3e1;--r:#b3261e;--n-bg:#eceef0;--n:#5f6b73;
  --band-sg:#e1f1e7;--band-g:#eef7f1;--band-y:#fcf5e3;--band-o:#fdeedf;--band-r:#fbe9e7;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#12161a;--surf:#1a2026;--ink:#e8edf1;--ink2:#b4bec6;--mut:#8a97a1;--line:#2c353d;--accent:#6aa7ee;--warn-bg:#3a2e12;--warn:#e8c26a;
  --sg-bg:#1d3a27;--sg:#7fd69a;--g-bg:#1e3326;--g:#8bd49c;--y-bg:#3a3014;--y:#e3b955;--o-bg:#3b2615;--o:#f3a15b;--r-bg:#3d1f1d;--r:#f58a82;--n-bg:#262e35;--n:#9aa7b1;
  --band-sg:#1b2e22;--band-g:#1a2a20;--band-y:#2a2616;--band-o:#2c2117;--band-r:#2e1c1b;}}
:root[data-theme=dark]{
  --bg:#12161a;--surf:#1a2026;--ink:#e8edf1;--ink2:#b4bec6;--mut:#8a97a1;--line:#2c353d;--accent:#6aa7ee;--warn-bg:#3a2e12;--warn:#e8c26a;
  --sg-bg:#1d3a27;--sg:#7fd69a;--g-bg:#1e3326;--g:#8bd49c;--y-bg:#3a3014;--y:#e3b955;--o-bg:#3b2615;--o:#f3a15b;--r-bg:#3d1f1d;--r:#f58a82;--n-bg:#262e35;--n:#9aa7b1;
  --band-sg:#1b2e22;--band-g:#1a2a20;--band-y:#2a2616;--band-o:#2c2117;--band-r:#2e1c1b;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Source Sans 3","Segoe UI",system-ui,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
.proto{background:var(--warn-bg);color:var(--warn);padding:6px 24px;font-size:12.5px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.proto label{margin-left:auto;display:flex;gap:6px;align-items:center;cursor:pointer}
.proto label+label{margin-left:0}
nav.top{display:flex;gap:4px;padding:10px 24px 0;border-bottom:1px solid var(--line)}
nav.top button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;color:var(--ink2);font-weight:600}
nav.top button[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
nav.top .sp{margin-left:auto;color:var(--mut);font-size:12.5px;align-self:center}
main{max-width:1280px;margin:0 auto;padding:12px 24px 130px}
h1{font-size:20px;margin:0 0 8px}
h2{font-size:15px;margin:0}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink2)}
select,input[type=number],input[type=text],textarea{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input[type=number]{width:84px}
input.w{width:78px;text-align:right;padding:5px 8px}
input.bad{border-color:var(--r);outline:1px solid var(--r)}
input:disabled,select:disabled{background:var(--surf);color:var(--mut);opacity:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--bg);border:0;padding:7px 14px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--surf);font-weight:700;box-shadow:inset 0 -2px 0 var(--accent)}
.seg button:disabled{color:var(--mut);cursor:not-allowed}
.btn{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer}
.btn.sm{padding:3px 10px;font-size:12.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--r);border-color:var(--r)}
.link{color:var(--accent);cursor:pointer;background:none;border:0;padding:0;text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.lv-sg{background:var(--sg-bg);color:var(--sg)}.lv-g{background:var(--g-bg);color:var(--g)}.lv-y{background:var(--y-bg);color:var(--y)}
.lv-o{background:var(--o-bg);color:var(--o)}.lv-r{background:var(--r-bg);color:var(--r)}.lv-n{background:var(--n-bg);color:var(--n)}
.chip.dash{background:none;border:1px dashed var(--mut);color:var(--mut)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.badge-warn{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.badge-ok{background:var(--g-bg);color:var(--g);border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:700}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px 14px;position:relative}
.hero{display:grid;grid-template-columns:1.25fr 1.15fr 1.1fr;gap:10px;margin:10px 0 6px}
.score{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.02em}
.muted{color:var(--mut)}.small{font-size:12.5px}
.gauge{margin-top:14px}
.gauge .bar{display:flex;height:10px;border-radius:5px;overflow:hidden;position:relative}
.gauge .bar i{flex:var(--f)}
.gauge .mark{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--ink);transform:translateX(-2px);box-shadow:0 0 0 2px var(--surf)}
.gauge .ticks{position:relative;height:30px;font-size:11px;color:var(--mut)}
.gauge .ticks span{position:absolute;transform:translateX(-50%);top:4px;white-space:nowrap}
.drv{display:grid;grid-template-columns:150px 1fr 48px;gap:4px 8px;align-items:center;font-size:12.5px;margin-top:6px}
.drv .track{height:10px;position:relative}
.drv .track::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.drv .fill{position:absolute;top:0;height:10px;border-radius:3px}
.drv b{text-align:right;font-variant-numeric:tabular-nums}
.cov{height:8px;border-radius:4px;background:var(--n-bg);overflow:hidden;margin:6px 0}
.cov i{display:block;height:100%;background:var(--accent)}
.alert{border-left:3px solid var(--warn);background:var(--warn-bg);color:var(--ink);border-radius:6px;padding:8px 10px;margin-top:8px;font-size:12.5px}
.tbl-head{display:flex;align-items:center;gap:12px;margin:12px 0 6px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);text-align:left;padding:6px 8px;border-bottom:2px solid var(--ink);font-weight:600}
td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.pillar td{background:var(--surf);font-weight:700;cursor:pointer}
tr.pillar td small{font-weight:400;color:var(--mut);margin-left:8px}
tr.ex td{color:var(--mut)}
td .sub{font-size:11.5px;color:var(--mut);margin-top:1px}
td .nm{font-weight:600}
td .val{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
tr.total td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
table.hidew .cw{display:none}
.edit{opacity:0;border:0;background:none;cursor:pointer;color:var(--accent);padding:2px 6px}
tr:hover .edit,.edit:focus{opacity:1}
.ok{color:var(--g)}.badv{color:var(--r)}
.note{position:absolute;top:-9px;left:-9px;background:var(--accent);color:#fff;border-radius:50%;width:20px;height:20px;font:700 11px/20px sans-serif;text-align:center;z-index:2;cursor:help}
body.nonotes .note{display:none}
.rel{position:relative}
.chart{margin-top:6px;width:100%;height:auto}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12px;display:none;z-index:50}
/* cấu hình */
.ctx{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stepper button{display:flex;gap:10px;align-items:center;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;position:relative}
.stepper button[aria-current=true]{border-color:var(--accent);background:var(--surf);box-shadow:inset 0 -3px 0 var(--accent)}
.stepper em{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--n-bg);font-weight:700;font-size:12px;flex:none}
.stepper button[aria-current=true] em{background:var(--accent);color:#fff}
.stepper em.done{background:var(--g-bg);color:var(--g)}
.stepper em.bad{background:var(--r-bg);color:var(--r)}
.stepper b{display:block;font-size:13px}.stepper small{color:var(--mut);font-size:11.5px}
.cfg{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
.outline{border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
.outline .ph{background:var(--surf);padding:8px 12px;font-weight:700;font-size:13px;display:flex;justify-content:space-between;border-top:1px solid var(--line)}
.outline .ph:first-child{border-top:0}.outline .ph span{font-weight:400;color:var(--mut)}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 12px;border-top:1px solid var(--line);cursor:pointer;border-left:4px solid transparent}
.item:hover{background:var(--surf)}
.item[aria-current=true]{background:var(--surf);border-left-color:var(--accent)}
.item .n{font-weight:600}.item .s{font-size:12px;color:var(--mut)}
.step{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;position:relative}
.step h2{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.step h2 em{font-style:normal;background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-grid;place-items:center;font-size:12px}
.cuts{display:grid;grid-template-columns:repeat(9,auto);gap:6px;align-items:center;justify-content:start}
.cuts .lvl{text-align:center}.cuts .lvl small{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:12px 0 4px}
.strip div{border-radius:8px;padding:8px 10px;font-size:12.5px;border:2px solid transparent}
.strip div.cur{border-color:var(--ink)}.strip b{display:block}
.errmsg{color:var(--r);font-size:12.5px;margin-top:6px}
.gcard{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.gcard .gh{display:flex;gap:10px;align-items:center;background:var(--surf);padding:8px 12px;flex-wrap:wrap}
.gcard .gh input[type=text]{font-weight:700;width:230px}
.gcard .gr{display:grid;grid-template-columns:1fr 190px 120px 40px;gap:8px;align-items:center;padding:6px 12px;border-top:1px solid var(--line)}
.gcard .ga{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.tag{font-size:11px;border-radius:5px;padding:1px 6px;background:var(--n-bg);color:var(--n)}
.tag.set{background:var(--y-bg);color:var(--y)}
.meter{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;margin:6px 0;background:var(--n-bg)}
.meter i{display:block;height:100%}
.chk{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.chk:first-child{border-top:0}
.bar-fix{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:20;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.bar-fix .sum{flex:1;min-width:280px}.bar-fix .chg{font-size:12.5px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;display:none;z-index:60}
.legend{max-width:1280px;margin:0 auto;padding:0 24px 140px;font-size:12.5px}
body.nonotes .legend{display:none}
.legend details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--surf)}
.legend summary{cursor:pointer;font-weight:700}
.legend ol{margin:8px 0 0;padding-left:0;list-style:none;columns:2;column-gap:28px}
.legend li{margin:6px 0;display:flex;gap:8px;break-inside:avoid}
.legend li b{background:var(--accent);color:#fff;border-radius:50%;min-width:18px;height:18px;font-size:10.5px;display:grid;place-items:center}
@media (max-width:980px){.hero,.cfg,.stepper{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="proto">
  <b>BẢN MẪU — không phải app thật.</b>
  <span>Số minh họa gần ảnh chụp 09/10/2026 (chỉ Nhà ở, không có số Yahoo/LME). Mốc, lịch sử và kỳ so sánh là giả định.</span>
  <label><input type="checkbox" id="tglNotes" checked> Hiện chú thích đề xuất</label>
  <label><select id="theme" aria-label="Giao diện"><option value="auto">Giao diện: theo máy</option><option value="light">Sáng</option><option value="dark">Tối</option></select></label>
</div>
<nav class="top" role="tablist">
  <button role="tab" id="t-sc" aria-selected="true">Scorecard</button>
  <button role="tab" id="t-cfg" aria-selected="false">Cấu hình scorecard</button>
  <span class="sp">Chế độ quản trị (mô phỏng)</span>
</nav>
<main id="v-sc"></main>
<main id="v-cfg" hidden></main>
<div class="legend" id="legend"></div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>

const LV = [{s: 2, n: "Rất tốt", c: "sg", a: "⇈"}, {s: 1, n: "Tốt", c: "g", a: "↑"}, {s: 0, n: "Trung tính", c: "y", a: "●"}, {s: -1, n: "Xấu", c: "o", a: "↓"}, {s: -2, n: "Rất xấu", c: "r", a: "⇊"}];

const BANDS = [{min: .8, n: "Rất thuận lợi", c: "sg"}, {min: .45, n: "Thuận lợi", c: "g"}, {min: .05, n: "Trung tính", c: "y"}, {min: -.2, n: "Bất lợi", c: "o"}, {min: -99, n: "Rất bất lợi", c: "r"}];
const rating = s => BANDS.find(b => s >= b.min - 1e-9);
const CAT = [
  {id: "deposit", name: "LS huy động 12 tháng (Big4)", upd: "06/10/2026", val: 5.90, unit: "%", how: "giá trị gốc", dir: "bad", cuts: [4.75, 5.5, 6.25, 7], pv: {1: 0, 3: 1, 12: 2}, seed: 3, desc: "Lãi huy động 12 tháng Big4, đi trước lãi vay mua nhà 1–2 quý."},
  {id: "govbond", name: "Lợi suất TPCP 10 năm", upd: "31/07/2026", val: 1.2, unit: "điểm %", how: "thay đổi 12 tháng", dir: "bad", cuts: [-.5, 0, .5, 1], stale: true, pv: {1: -2, 3: -2, 12: -1}, seed: 5, desc: "Chấm theo thay đổi 12 tháng vì chuỗi có xu hướng."},
  {id: "effr", name: "Lãi suất liên bang hiệu lực (EFFR)", upd: "02/10/2026", val: 3.88, unit: "%", how: "giá trị gốc", info: true, seed: 8, cmp: {kind: "Kỳ vọng thị trường", when: "12/2026", v: "4,09%", gap: "+0,21 điểm % so hiện tại"}},
  {id: "onight", name: "LS liên ngân hàng qua đêm", upd: "31/07/2026", val: 3.74, unit: "%", how: "trung bình 20 ngày", dir: "bad", cuts: [2, 3, 4, 5], stale: true, pv: {1: 0, 3: 0, 12: 1}, seed: 11, desc: "Trung bình 20 ngày để tránh gai Tết."},
  {id: "credit", name: "Tăng trưởng tín dụng từ đầu năm", upd: "T8/2026", val: 10.19, unit: "%", how: "% so cùng kỳ", two: true, fixed: 1, pv: {1: 0, 3: 0, 12: -1}, seed: 13, cmp: {kind: "Mục tiêu Chính phủ", when: "cả năm 2026", v: "15,0%", gap: "còn cách mục tiêu 4,81 điểm %"}, desc: "Hai phía: quá nóng cũng bị trừ điểm (sửa ở bản thật)."},
  {id: "gdp", name: "Tăng trưởng GDP (số công bố)", upd: "Q2/2026", val: 8.39, unit: "%", how: "% so cùng kỳ", dir: "good", cuts: [5, 6, 7, 8], pv: {1: 2, 3: 1, 12: 0}, seed: 17, cmp: {kind: "Mục tiêu Chính phủ", when: "cả năm 2026", v: "10,0%", gap: "mốc cả năm, không phải dự báo quý"}, desc: "Mục tiêu 2026 là 10%."},
  {id: "cpi", name: "CPI so cùng kỳ", upd: "T8/2026", val: 4.89, unit: "%", how: "% so cùng kỳ", dir: "bad", cuts: [2.5, 3.5, 4.5, 5.5], pv: {1: 0, 3: 1, 12: 1}, seed: 19, desc: "Mục tiêu CPI bình quân khoảng 4,5%."},

  {id: "fx", name: "Tỷ giá trung tâm USD/VND", upd: "10/08/2026", val: 1.04, unit: "%", how: "% so cùng kỳ", dir: "bad", cuts: [1, 2, 3, 5], stale: true, pv: {1: 1, 3: 1, 12: 0}, seed: 29, desc: "Biên độ ±5%."},
  {id: "infra", name: "Tiến độ đầu tư công so kế hoạch năm", upd: "T9/2026", val: -10.77, unit: "điểm %", how: "chênh so tiến độ kế hoạch", dir: "good", cuts: [-15, -5, 5, 15], pv: {1: -1, 3: 0, 12: 0}, seed: 31, desc: "Thay số lũy kế từ đầu năm (nhiễu tháng 1–2)."},
  {id: "ncs", name: "Vốn đầu tư NSNN thực hiện lũy kế", upd: "T9/2026", val: 656789, unit: "tỷ đồng", how: "giá trị gốc", info: true, seed: 37, cmp: {kind: "Kế hoạch năm", when: "2026", v: "1.022.607 tỷ", gap: "đạt 64,2% kế hoạch"}},
  {id: "pmi", name: "PMI sản xuất Việt Nam", upd: "T8/2026", val: 53.3, unit: "điểm", how: "giá trị gốc", dir: "good", cuts: [47, 49, 50, 52], pv: {1: 2, 3: 2, 12: 1}, seed: 41, desc: "50 là ranh giới mở rộng/thu hẹp."},
  {id: "export", name: "Xuất khẩu so cùng kỳ", upd: "T7/2026", val: 24.2, unit: "%", how: "trung bình 3 tháng", dir: "good", cuts: [0, 5, 10, 15], pv: {1: 2, 3: 1, 12: 1}, seed: 43, desc: "Mốc là nhận định."},
  {id: "fdi", name: "FDI đăng ký mới", upd: "T7/2026", val: 49.1, unit: "%", how: "tổng 12 tháng, % so cùng kỳ", dir: "good", cuts: [-20, -5, 5, 20], pv: {1: 2, 3: 2, 12: 2}, seed: 47, desc: "Dẫn trước nhu cầu thuê KCN 6–18 tháng."}];
const C = Object.fromEntries(CAT.map(c => [c.id, c]));
const clone = o => JSON.parse(JSON.stringify(o));
const freshCfg = () => Object.fromEntries(CAT.map(c => [c.id, {cuts: c.cuts ? [...c.cuts] : null, dir: c.dir || null}]));

function drawHist(c) {
  const n = 120, R = rng(77), sc = new Array(n), cov = new Array(n);
  sc[n - 1] = c.total; sc[n - 2] = c.prevTotal; for (let i = n - 2; i > 0; i--) sc[i - 1] = Math.max(-1.4, Math.min(1.15, sc[i] + (R() - .5) * .34 - sc[i] * .03));
  for (let i = 0; i < n; i++) cov[i] = i >= n - 1 ? c.cov : .7 + R() * .3;
  const m = Math.min(st.look * 12, n), s0 = n - m, W = 900, H = 200, L = 40, Rr = 150, T = 10, B = 24;
  const y = v => T + (1.2 - v) / 2.7 * (H - T - B), x = i => L + (i - s0) / (m - 1) * (W - L - Rr);
  const bands = [[1.2, .8, "sg", "Rất thuận lợi", "≥ 0,8"], [.8, .45, "g", "Thuận lợi", "0,45 – 0,8"], [.45, .05, "y", "Trung tính", "0,05 – 0,45"], [.05, -.2, "o", "Bất lợi", "−0,2 – 0,05"], [-.2, -1.5, "r", "Rất bất lợi", "< −0,2"]];
  let svg = bands.map(([a, b, k, nm, rg]) => `<rect x="${L}" y="${y(a)}" width="${W - L - Rr}" height="${y(b) - y(a)}" fill="var(--band-${k})"/><text x="${W - Rr + 8}" y="${(y(a) + y(b)) / 2 + 4}" font-size="11.5" fill="var(--ink2)">${nm} <tspan fill="var(--mut)">${rg}</tspan></text>`).join("");
  [1, .5, 0, -.5, -1].forEach(v => svg += `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" font-size="11" text-anchor="end" fill="var(--mut)">${fmt(v, 1)}</text>`);
  const dt0 = i => new Date(2026, 8 - (n - 1 - i), 1);
  for (let i = s0; i < n; i++) { const d = dt0(i); if (d.getMonth() === 0) svg += `<text x="${x(i)}" y="${H - 6}" font-size="11" text-anchor="middle" fill="var(--mut)">${d.getFullYear()}</text>`; }
  const pts = []; for (let i = s0; i < n; i++) pts.push(`${x(i)},${y(sc[i])}`);
  svg += `<polyline fill="none" stroke="var(--ink)" stroke-width="2" points="${pts.join(" ")}"/><circle cx="${x(n - 1)}" cy="${y(sc[n - 1])}" r="5" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/>`;
  const el = $("#hist"); el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Điểm theo tháng">${svg}<line id="xh" y1="${T}" y2="${H - B}" stroke="var(--mut)" style="display:none"/></svg>`;
  const sv = $("svg", el), tip = $("#tip");
  const label = i => { const d = dt0(i); return `${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`; };
  sv.onmousemove = e => { const b = sv.getBoundingClientRect(), px = (e.clientX - b.left) / b.width * W; const i = Math.max(s0, Math.min(n - 1, Math.round((px - L) / (W - L - Rr) * (m - 1)) + s0));
    const xl = $("#xh"); xl.setAttribute("x1", x(i)); xl.setAttribute("x2", x(i)); xl.style.display = "";
    tip.style.display = "block"; tip.style.left = e.clientX + 12 + "px"; tip.style.top = e.clientY + 12 + "px";
    tip.innerHTML = `<b>${label(i)}</b><br>Điểm ${sg(sc[i])} · ${rating(sc[i]).n}<br>Độ phủ ${fmt(cov[i] * 100, 0)}%`; };
  sv.onmouseleave = () => { tip.style.display = "none"; $("#xh").style.display = "none"; };
}

    const edges = [mx, ...[...cf.cuts].reverse(), mn], cols = cf.dir === "bad" ? ["r", "o", "y", "g", "sg"] : ["sg", "g", "y", "o", "r"]; let b = "";
    for (let i = 0; i < 5; i++) b += `<rect x="36" y="${y(edges[i])}" width="${W - 44}" height="${Math.max(0, y(edges[i + 1]) - y(edges[i]))}" fill="var(--band-${cols[i]})"/>`;
    [mn + .1, (mn + mx) / 2, mx - .1].forEach(v => b += `<text x="30" y="${y(v) + 4}" font-size="10.5" text-anchor="end" fill="var(--mut)">${fmt(v, 1)}</text>`);
    $("#cfgchart").innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}">${b}<polyline fill="none" stroke="var(--ink)" stroke-width="1.8" points="${s.map((v, i) => `${x(i)},${y(v)}`).join(" ")}"/><circle cx="${x(s.length - 1)}" cy="${y(s[s.length - 1])}" r="5" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/></svg>`; }
}
function renderStep4(el) {
  const d = st.w.draft, v = validate(d), c = calcBo(d);
  el.innerHTML = `<div class="step rel">${note(19)}<h2><em>4</em>Kiểm tra trước khi lưu</h2>${v.map(x => `<div class="chk"><span class="${x.ok ? "ok" : "badv"}" style="font-weight:700">${x.ok ? "✓" : "!"}</span><span>${x.t}</span>${x.ok ? "" : `<button class="link" data-act="step|${x.step}">Sửa ở bước ${x.step}</button>`}</div>`).join("")}</div>
    <div class="step"><h2>Tóm tắt cấu trúc</h2><table><thead><tr><th>Nhóm</th><th class="r">Tỷ trọng</th><th>Chỉ số</th></tr></thead><tbody>${c.pil.map(p => `<tr><td><b>${p.name}</b></td><td class="r">${fmt(p.gw * 100, 1)}%</td>
      <td>${p.rows.map(r => `${r.name}${r.info ? " (tham khảo)" : ` · ${fmt(r.w * 100, 1)}%`}`).join("<br>")}</td></tr>`).join("") || '<tr><td colspan="3" class="muted">Chưa có nhóm.</td></tr>'}</tbody></table></div>
    <div class="card">Điểm xem trước: <b style="font-size:18px">${isFinite(c.total) ? sg(c.total) : "—"}</b> ${rchip(c.total)} <span class="muted small">· độ phủ ${fmt(c.cov * 100, 0)}%</span></div>`;
}
function renderBar() {
  const w = st.w, d = w.draft, bar = $("#bar"); if (!bar) return;
  const v = validate(d), okAll = v.every(x => x.ok), dirty = isDirty(), cur = calcBo(d);
  const base = w.isNew ? null : calcBo(baseline()), items = [];
  if (!w.isNew && dirty) {
    if (JSON.stringify(baseline().struct) !== JSON.stringify(d.struct)) items.push("Cấu trúc hoặc tỷ trọng đã thay đổi");
    cur.rows.forEach(r => { const b = base.rows.find(x => x.id === r.id); if (b && r.score != null && b.score != null && b.score !== r.score) items.push(`${r.name}: ${lvOf(b.score).n} → <b>${lvOf(r.score).n}</b>`); });
  }
  const t = x => isFinite(x.total) ? sg(x.total) : "—";
  const sum = w.isNew ? `Điểm xem trước: <b>${t(cur)}</b> ${rchip(cur.total)}` : `Điểm: <b>${t(base)}</b> ${dirty ? `→ <b style="font-size:16px">${t(cur)}</b> ${rchip(cur.total)}` : `${rchip(cur.total)} · không có thay đổi`}`;
  const lastStep = w.step === 4;
  bar.innerHTML = `${w.step === 1 ? note(20) : ""}<div class="sum"><div>${sum}</div><div class="chg">${w.isNew ? (okAll ? "Sẵn sàng lưu." : `Còn ${v.filter(x => !x.ok).length} mục chưa đạt (xem bước 4).`) : dirty ? `<b>${items.length || 1} thay đổi chưa lưu</b>${items.length ? "<br>" + items.join("<br>") : ""}` : "Sửa ở các bước để xem tác động lên điểm tổng."}</div></div>
    <button class="btn" data-act="discard" ${dirty || w.isNew ? "" : "disabled"}>${w.isNew ? "Hủy tạo" : "Bỏ thay đổi"}</button>
    <button class="btn" data-act="back" ${w.step === 1 ? "disabled" : ""}>← Quay lại</button>
    ${lastStep ? `<button class="btn primary" data-act="save" ${okAll && (dirty || w.isNew) ? "" : "disabled"}>Lưu scorecard</button><button class="btn" data-act="approve" ${!w.isNew && !dirty && okAll && !activeOrEdit().approved ? "" : "disabled"} title="Chỉ người phụ trách QTRR được duyệt">Duyệt áp dụng…</button>`
      : `<button class="btn primary" data-act="next">Tiếp →</button>`}`;
}

/* ============ điều khiển ============ */
function showTab(t) { st.tab = t; $("#v-sc").hidden = t !== "sc"; $("#v-cfg").hidden = t !== "cfg";
  $("#t-sc").setAttribute("aria-selected", t === "sc"); $("#t-cfg").setAttribute("aria-selected", t === "cfg"); t === "sc" ? renderSc() : renderCfg(); window.scrollTo(0, 0); }
function openWiz(boId, step, sel) { const b = st.bos.find(x => x.id === boId), w = st.w;
  if (!(w.draft && !w.isNew && w.editId === boId)) w.draft = clone({name: b.name, desc: b.desc, struct: b.struct, cfg: b.cfg, conf: b.conf});
  Object.assign(w, {view: "wiz", isNew: false, editId: boId, step, sel: sel || w.sel}); showTab("cfg"); }
function mut(fn) { fn(); renderCfg(); }
const num = v => { const x = parseFloat(String(v).replace(",", ".")); return v === "" || Number.isNaN(x) ? null : Math.max(0, x); };
$("#t-sc").onclick = () => showTab("sc"); $("#t-cfg").onclick = () => showTab("cfg");
document.addEventListener("click", e => {
  if (e.target.id === "tglW") { st.hideW = !st.hideW; return renderSc(); }
  const cm = e.target.closest("[data-c]"); if (cm) { st.cmp = +cm.dataset.c; return renderSc(); }
  const lk = e.target.closest("[data-y]"); if (lk) { st.look = +lk.dataset.y; return renderSc(); }
  const t = e.target.closest("[data-act]");
  if (!t) { const tr = e.target.closest("tr.pillar"); if (tr) { st.collapsed[tr.dataset.p] = !st.collapsed[tr.dataset.p]; renderSc(); } return; }
  const [a, x, y] = t.dataset.act.split("|"), w = st.w, d = w.draft;
  switch (a) {
    case "gear": return openWiz(st.active, 2);
    case "editrow": return openWiz(st.active, 3, x);
    case "resume": return showTab("cfg");
    case "tosc": return showTab("sc");
    case "tolist": w.view = "list"; return renderCfg();
    case "new": Object.assign(w, {view: "wiz", isNew: true, editId: null, step: 1, sel: null, draft: EMPTY()}); return renderCfg();
    case "edit": return openWiz(x, 1);
    case "clone": { const b = st.bos.find(z => z.id === x); Object.assign(w, {view: "wiz", isNew: true, editId: null, step: 1, sel: null, draft: clone({name: b.name + " (bản sao)", desc: b.desc, struct: b.struct, cfg: b.cfg, conf: b.conf})}); return renderCfg(); }
    case "step": w.step = +x; return renderCfg();
    case "next": w.step = Math.min(4, w.step + 1); return renderCfg();
    case "back": w.step = Math.max(1, w.step - 1); return renderCfg();
    case "sel": w.sel = x; return renderCfg();
    case "eqall": return mut(() => d.struct.groups.forEach(g => { g.w = null; g.rows.forEach(r => r.w = null); }));
    case "eqrows": return mut(() => d.struct.groups[+x].rows.forEach(r => r.w = null));
    case "delg": return mut(() => { d.struct.groups.splice(+x, 1); toast("Đã xóa nhóm. Bỏ thay đổi để hoàn tác."); });
    case "delrow": return mut(() => d.struct.groups[+x].rows.splice(+y, 1));
    case "addrow": { const id = $(`#add-${x}`).value; if (!id) return toast("Chọn một chỉ số trước"); return mut(() => { d.struct.groups[+x].rows.push({id, w: null}); d.conf[id] = !!(C[id].info || C[id].two); w.sel = id; }); }
    case "addg": { const nm = ($("#newg").value || "").trim() || "Nhóm mới"; return mut(() => d.struct.groups.push({id: "g" + (++gseq), name: nm, w: null, rows: []})); }
    case "conf": return mut(() => d.conf[w.sel] = true);
    case "sug": { const r = C[w.sel], s = [...series(r)].sort((p, q) => p - q), q = p => s[Math.floor(p * (s.length - 1))]; return mut(() => { d.cfg[w.sel].cuts = [.1, .3, .7, .9].map(p => +q(p).toFixed(2)); d.conf[w.sel] = false; }); }
    case "rst": return mut(() => { d.cfg[w.sel] = {cuts: C[w.sel].cuts ? [...C[w.sel].cuts] : null, dir: C[w.sel].dir}; });
    case "delsel": return mut(() => { d.struct.groups.forEach(g => g.rows = g.rows.filter(r => r.id !== w.sel)); w.sel = null; });
    case "discard": if (w.isNew) { w.draft = null; w.view = "list"; } else { w.draft = null; openWiz(w.editId, w.step); return; } return renderCfg();
    case "save": { const upd = "09/10/2026";
      if (w.isNew) { const id = "bo" + (st.bos.length + 1); st.bos.push({id, seg: "Nhà ở", approved: false, updated: upd, ...clone(d)}); st.active = id; w.draft = null; w.view = "list"; toast("Đã lưu scorecard mới (nháp). Mở tab Scorecard để xem."); }
      else { Object.assign(st.bos.find(b => b.id === w.editId), clone(d), {approved: false, updated: upd}); toast("Đã lưu. Chưa duyệt."); }
      return renderCfg(); }
    case "approve": activeOrEdit().approved = true; toast("Đã duyệt: ngưỡng áp dụng cho Scorecard."); return renderCfg();
  }
});
document.addEventListener("input", e => {
  const el = e.target, w = st.w, d = w.draft;
  if (el.id === "bosel") { st.active = el.value; return renderSc(); }
  if (!d) return;
  if (el.dataset.f === "name" || el.dataset.f === "desc") { d[el.dataset.f] = el.value; return renderBar(); }
  if (el.dataset.cut !== undefined) { const i = +el.dataset.cut, pos = el.selectionStart; d.cfg[w.sel].cuts[i] = num(el.value) ?? NaN; d.conf[w.sel] = true; renderCfg();
    const nx = $(`[data-cut="${i}"]`); if (nx) { nx.focus(); try { nx.setSelectionRange(pos, pos); } catch (_) {} } return; }
  if (el.dataset.chg === "dir") { d.cfg[w.sel].dir = el.value; d.conf[w.sel] = true; renderCfg(); }
  if (el.dataset.chg === "mvg") { const to = +el.value; d.struct.groups.forEach(g => g.rows = g.rows.filter(r => r.id !== w.sel)); d.struct.groups[to].rows.push({id: w.sel, w: null}); renderCfg(); }
});
document.addEventListener("change", e => {
  const el = e.target, d = st.w.draft; if (!d || !el.dataset.chg) return;
  const [k, i, j] = el.dataset.chg.split("|");
  if (k === "gw") d.struct.groups[+i].w = num(el.value);
  else if (k === "rw") d.struct.groups[+i].rows[+j].w = num(el.value);
  else if (k === "gname") d.struct.groups[+i].name = el.value.trim() || d.struct.groups[+i].name;
  else return;
  renderCfg();
});
document.addEventListener("keydown", e => { const it = e.target.closest && e.target.closest("[data-act^='sel|']"); if (it && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); st.w.sel = it.dataset.act.split("|")[1]; renderCfg(); } });
$("#tglNotes").onchange = e => document.body.classList.toggle("nonotes", !e.target.checked);
$("#theme").onchange = e => { const v = e.target.value; v === "auto" ? document.documentElement.removeAttribute("data-theme") : document.documentElement.setAttribute("data-theme", v); st.tab === "sc" ? renderSc() : renderCfg(); };
$("#legend").innerHTML = `<details open><summary>Chú thích đề xuất (số trong vòng tròn xanh trên trang)</summary><ol>${NOTES.map((t, i) => `<li><b>${i + 1}</b><span>${t}</span></li>`).join("")}</ol></details>`;
renderSc();
window.__proto = {calcBo, st, validate, activeBo};
</script>
