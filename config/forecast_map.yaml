# Bản đồ chỉ số thực tế → kế hoạch / dự báo (chỉ để tham khảo, không vào điểm scorecard).
# Ghi bởi trang 'Kế hoạch & dự báo'. Loại: target | fedwatch | indicator | manual
# (xem giải thích trong docs/spec.md, D14).
mappings:
- code: credit_ytd
  kind: target
  ref: vn.target_credit_growth
  label: Mục tiêu CP
  note: Chỉ tiêu tín dụng cả năm (cuối năm so cuối năm trước), so với tăng từ đầu năm.
- code: credit_yoy
  kind: target
  ref: vn.target_credit_growth
  label: Mục tiêu CP
  note: Cùng chỉ tiêu cả năm. Tháng 12 số so cùng kỳ bằng số từ đầu năm nên so được.
- code: gdp_yoy_published
  kind: target
  ref: vn.target_gdp_growth
  label: Mục tiêu CP
  note: Mục tiêu tăng trưởng GDP cả năm.
- code: cpi_avg_ytd
  kind: target
  ref: vn.target_cpi_avg
  label: Mục tiêu CP
  note: Mục tiêu CPI bình quân cả năm, so với CPI bình quân từ đầu năm.
- code: effr
  kind: fedwatch
  ref: effective
  label: FedWatch
  note: Lãi suất hiệu dụng kỳ vọng = biên dưới kỳ vọng + 8 bps, kỳ họp cuối năm.
- code: fed_upper
  kind: fedwatch
  ref: upper
  label: FedWatch
  note: Biên trên kỳ vọng theo xác suất CME, kỳ họp cuối năm.
- code: fed_lower
  kind: fedwatch
  ref: lower
  label: FedWatch
  note: Biên dưới kỳ vọng theo xác suất CME, kỳ họp cuối năm.
- code: brent
  kind: indicator
  ref: brent_futures
  label: HĐ tương lai
  note: Giá Brent kỳ hạn gần nhất (ICE) so với giá giao ngay.
- code: public_investment_ytd
  kind: manual
  value: 1022607.0
  period: '2026'
  label: KH TTg giao
  note: Kế hoạch vốn đầu tư công 2026 Thủ tướng giao chi tiết (Bộ Tài chính, BC 818/BC-BTC).
    Thực tế là vốn thực hiện từ NSNN (GSO), chỉ so gần đúng với số giải ngân của Bộ
    Tài chính (9 tháng 642.962 tỷ = 62,9% KH). Mỗi năm thêm một dòng.
