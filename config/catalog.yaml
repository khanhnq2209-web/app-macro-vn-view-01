    source_url: https://fred.stlouisfed.org/series/MORTGAGE30US
    recipe: {op: raw, input: fred.MORTGAGE30US}
    change_unit: bps
    impact_sign: 0
    direction: up_bad
    segment: housing
    decimals: 2

  # ---------------- B1 Tăng trưởng ----------------
  # Chỉ số đại diện = tăng trưởng GDP CÔNG BỐ (GSO qua VBMA). Chuỗi tự tính từ mức GDP trong
  # GDP-So-Sanh.xlsx có điểm gãy năm gốc (Q1/2021, Q1/2026) → giữ để đối chiếu, gắn cờ.
  - code: gdp_yoy_published
    name: Tăng trưởng GDP (số công bố)
    group: B1
    unit: "%"
    frequency: Q
    source: GSO · VBMA
    source_url: https://vbma.org.vn/vi/market-data/macro-economic-heatmap
    recipe: {op: quarter_last, input: vbma.gdp_yoy}
    change_unit: pp
    flags: [no_repeat_check]  # số công bố làm tròn 1 chữ số, trùng kỳ là bình thường
    direction: up_good
    segment: both
    target: vn.target_gdp_growth
    representative: true
    decimals: 1
  - code: gdp_yoy
    name: Tăng trưởng GDP (tự tính)
    group: B1
    unit: "%"
    frequency: Q
    source: GSO · dulieukinhte
    source_url: https://dulieukinhte.com/
    recipe: {op: yoy, input: vn.gdp_real}
    change_unit: pp
    impact_sign: 0
    direction: up_good
