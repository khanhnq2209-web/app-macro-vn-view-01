    frequency: D
    source: FRED (EIA)
    source_url: https://fred.stlouisfed.org/series/DCOILBRENTEU
    recipe: {op: raw, input: fred.DCOILBRENTEU}
    change_unit: pct
    direction: up_bad
    segment: both
    representative: true
    decimals: 2

  - code: brent_vnd
    name: Dầu Brent quy ra VND (Brent × tỷ giá trung tâm)
    group: A2
    unit: triệu VND/thùng
    frequency: D
    source: Tính toán (FRED/EIA, NHNN)
    source_url: ""
    recipe: {op: product, inputs: [brent, fx_central], scale: 0.000001}
    change_unit: pct
    direction: up_bad
    segment: both
    decimals: 2
  - code: brent_futures
