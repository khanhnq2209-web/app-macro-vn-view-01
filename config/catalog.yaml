# Danh mục chỉ số của app. Thêm chỉ số thì thêm một mục ở đây, không cần sửa code giao diện.
#
# Trường:
#   code            mã (snake_case, duy nhất)
#   name            tên hiển thị tiếng Việt
#   group           A1..A5 (bên ngoài), B1..B4, C1, D2, E1 (trong nước), khớp với impact_rules.yaml
#   unit            đơn vị hiển thị của giá trị (%, điểm, USD/thùng, VND/USD, tỷ đồng, triệu USD)
#   frequency       D (ngày) | W (tuần) | M (tháng) | Q (quý) | A (năm)
#   source          nhãn nguồn hiển thị trên card ("kỳ · nguồn")
#   source_url      link nguồn gốc
#   recipe          cách tính từ chuỗi raw (xem src/macro_app/metrics/recipes.py)
#   change_unit     cách ghi thay đổi: bps (lãi suất) | pp (điểm %) | pct (% tương đối)
#   direction       up_bad (tăng là bất lợi BĐS) | up_good | two_way
#   segment         housing | industrial | both: phân khúc BĐS liên quan
#   target          mã chuỗi mục tiêu Chính phủ (tùy chọn)
#   flags           unit_unverified | cumulative_ytd | check_rebase | ytd (số lũy kế từ đầu năm,
#                   reset tháng 1 → thay đổi + hướng so CÙNG KỲ năm trước)
#   representative  true = chỉ số đại diện nhóm khi tính hướng tác động (1 chỉ số/nhóm)
#   impact_sign     1 (mặc định) = cùng chiều khái niệm của nhóm; -1 = ngược chiều (vd spread HY tăng
#                   nghĩa là tăng trưởng toàn cầu xấu đi); 0 = không suy ra tác động BĐS
#   decimals        số chữ số thập phân hiển thị
#   manual          true = đọc từ data/raw/manual/manual_inputs.csv (sửa file trực tiếp, app không có form)

indicators:
  # ---------------- A1 Fed và USD ----------------
  - code: fed_upper
    name: Lãi suất Fed (biên trên)
    group: A1
    unit: "%"
    frequency: D
    source: FRED
    source_url: https://fred.stlouisfed.org/series/DFEDTARU
    recipe: {op: raw, input: fred.DFEDTARU}
    change_unit: bps
    direction: up_bad
    segment: both
    representative: true
    decimals: 2
  - code: fed_lower
    name: Lãi suất Fed (biên dưới)
    group: A1
    unit: "%"
    frequency: D
    source: FRED
    source_url: https://fred.stlouisfed.org/series/DFEDTARL
    recipe: {op: raw, input: fred.DFEDTARL}
    change_unit: bps
    direction: up_bad
    segment: both
    decimals: 2
  - code: effr
    name: Lãi suất liên bang hiệu lực (EFFR)
    group: A1
    unit: "%"
    frequency: D
    source: FRED
    source_url: https://fred.stlouisfed.org/series/DFF
    recipe: {op: raw, input: fred.DFF}
    change_unit: bps
    direction: up_bad
    segment: both
    decimals: 2
  - code: ust_2y
    name: Lợi suất UST 2 năm
    group: A1
    unit: "%"
    frequency: D
    source: FRED
    source_url: https://fred.stlouisfed.org/series/DGS2
    recipe: {op: raw, input: fred.DGS2}
    change_unit: bps
    direction: up_bad
    segment: both
    decimals: 2
  - code: ust_10y
    name: Lợi suất UST 10 năm
    group: A1
    unit: "%"
    frequency: D
    source: FRED
    source_url: https://fred.stlouisfed.org/series/DGS10
    recipe: {op: raw, input: fred.DGS10}
    change_unit: bps
    direction: up_bad
    segment: both
    decimals: 2
  - code: ust_10y2y
    name: Độ dốc UST 10Y − 2Y
    group: A1
    unit: "điểm %"
    frequency: D
    source: FRED
    source_url: https://fred.stlouisfed.org/series/T10Y2Y
    recipe: {op: raw, input: fred.T10Y2Y}
    change_unit: bps
    impact_sign: 0
    direction: two_way
    segment: both
    decimals: 2
  - code: usd_broad
    name: Chỉ số USD (broad, Fed)
    group: A1
    unit: điểm
    frequency: D
    source: FRED
    source_url: https://fred.stlouisfed.org/series/DTWEXBGS
    recipe: {op: raw, input: fred.DTWEXBGS}
    change_unit: pct
    direction: up_bad
    segment: both
    decimals: 2
  - code: dxy
    name: Chỉ số USD (DXY)
    group: A1
    unit: điểm
    frequency: D
    source: Yahoo Finance
    source_url: https://finance.yahoo.com/quote/DX-Y.NYB
    recipe: {op: raw, input: yahoo.DX-Y.NYB}
    change_unit: pct
    direction: up_bad
    segment: both
    decimals: 2

  # ---------------- A2 Năng lượng ----------------
  # Không nối 2 nguồn: Dated Brent (FRED/EIA, trễ ~1 tuần) và hợp đồng tương lai BZ=F (Yahoo, mới
  # nhất) lệch nhau 10–15 USD lúc thị trường căng → nối sẽ tạo cú giảm giá giả.
  - code: brent
    name: Dầu Brent giao ngay (EIA)
    group: A2
