# Gắn chuỗi của repo (vn.*) với mã chuỗi (series id) trên API dulieukinhte.com.
# Dòng chưa có id thì bỏ qua lúc kéo (vẫn dùng file Excel trong data/raw).
# Tìm mã: python -m macro_app.io.dulieukinhte_api find "tăng trưởng tín dụng"
# Gói miễn phí 100 lượt/tháng: mỗi chuỗi tốn khoảng 1 lượt mỗi lần Refresh.
min_days: 7  # đã kéo trong 7 ngày gần nhất thì nút Refresh bỏ qua (không tốn lượt)
series:
  vn.credit_ytd:
    id: 29926
    note: Tăng trưởng tín dụng so đầu năm (bộ 353, NHNN), % so cuối năm trước
  vn.credit_construction_ytd:
    id: 29921
    note: Tăng trưởng tín dụng xây dựng so đầu năm (bộ 353)
  vn.public_investment:
    id: 24585
    note: Tổng vốn đầu tư từ ngân sách nhà nước (bộ 317), tỷ đồng, số từng tháng
  vn.m2_ytd:
    id:
    note: >-
      Chưa gắn. API chỉ có M2 dạng số tuyệt đối (id 33445 "Tổng phương tiện thanh toán M2"),
      không có % so đầu năm như chuỗi này; file Excel đang lỗi từ 10/2025.
  vn.govbond_10y:
    id: 36714
    note: Lợi suất TPCP kỳ hạn 10 năm (ngày), %. Gắn 09/10/2026 vì file Excel chỉ tới 31/07/2026
  vn.ib_on:
    id: 34248
    note: Lãi suất liên ngân hàng qua đêm (ngày), %. Gắn 09/10/2026
  vn.fx_central:
    id: 33444
    note: Tỷ giá trung tâm USD/VND của NHNN (ngày). Gắn 09/10/2026
  vn.fdi_disbursed:
    id: 18833
    note: Vốn thực hiện đầu tư trực tiếp từ nước ngoài (FDI giải ngân), triệu USD, tháng. Gắn 10/10/2026
  vn.fx_vcb_sell:
    id: 33417
    note: Tỷ giá bán USD Vietcombank (ngày). Gắn 10/10/2026, phản ánh giá thị trường sát hơn tỷ giá trung tâm
