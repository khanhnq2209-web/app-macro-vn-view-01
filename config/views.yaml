# Bố cục mặc định của các trang (view "Mặc định", không ghi đè được từ giao diện).
# View tùy chỉnh dùng chung (quản trị lưu) nằm ở config/views.d/<tên>.yaml, cùng cấu trúc.
# Tùy chỉnh chỉ đổi cách hiển thị, không đụng tới công thức, ngưỡng hay quy tắc tác động.
#
# chart: title, codes (1+), kind line|bar|area, range 1Y|3Y|5Y|10Y|ALL,
#        transform level|yoy|ytd|zscore, show_target, show_bands, secondary (mã vẽ trục phụ), note
name: Mặc định
overview:
  blocks:
    - title: BÊN NGOÀI, VIỆT NAM KHÔNG KIỂM SOÁT
      codes: [fed_upper, ust_2y, ust_10y, usd_broad, dxy, brent, wti, gas_henry_hub, copper, hy_spread, breakeven_10y, vix, gpr, us_mortgage_30y]
    - title: TRONG NƯỚC
      codes: [gdp_yoy_published, pmi_vn, cpi_yoy, cpi_avg_ytd, fx_central_ytd, deposit_12m_big4, interbank_on, govbond_10y, real_rate, credit_ytd, credit_minus_m2, land_use_revenue, public_investment_ytd_yoy, fdi_registered_ytd]
international:
  charts:
    - {group: A1, title: Lãi suất Fed và EFFR, codes: [fed_upper, fed_lower, effr], range: 5Y}
    - {group: A1, title: Lợi suất trái phiếu Mỹ, codes: [ust_2y, ust_10y], range: 5Y}
    - {group: A1, title: Độ dốc 10Y − 2Y, codes: [ust_10y2y], range: 5Y}
    - {group: A1, title: Chỉ số USD, codes: [usd_broad], range: 5Y}
    - {group: A1, title: DXY, codes: [dxy], range: 5Y}
    - {group: A2, title: Dầu Brent và WTI giao ngay (EIA), codes: [brent, wti], range: 5Y}
    - {group: A2, title: Dầu Brent giao ngay và kỳ hạn, codes: [brent, brent_futures], range: 3Y}
    - {group: A2, title: "Khí tự nhiên: Mỹ, châu Âu, LNG châu Á", codes: [gas_henry_hub, gas_eu, lng_asia], range: 5Y}
    - {group: A2, title: Giá xăng bán lẻ Mỹ, codes: [gasoline_us], range: 5Y}
    - {group: A2, title: Biến động giá dầu (OVX), codes: [oil_vol], range: 5Y}
    - {group: A3, title: Giá đồng LME (USD/tấn), codes: [copper], range: 5Y}
    - {group: A3, title: Tồn kho đồng LME, codes: [copper_lme_stock], range: 5Y}
    - {group: A3, title: "Đồng COMEX (USD/lb, đối chiếu)", codes: [copper_comex], range: 5Y}
    - {group: A3, title: Giá đồng thế giới (IMF), codes: [copper_imf], range: 10Y}
    - {group: A5, title: Rủi ro địa chính trị (GPR), codes: [gpr], range: 10Y}
    - {group: A5, title: Bất định chính sách kinh tế toàn cầu (GEPU), codes: [policy_uncertainty], range: 10Y}
    - {group: A5, title: "Tăng trưởng GDP thực Mỹ (quý, năm hóa)", codes: [us_gdp_growth], range: 10Y, kind: bar}
    - {group: A5, title: Sản xuất công nghiệp Mỹ so cùng kỳ, codes: [us_indpro], range: 10Y, transform: yoy}
    - {group: A5, title: Spread trái phiếu HY Mỹ, codes: [hy_spread], range: 5Y}
    - {group: A5, title: Lạm phát kỳ vọng 10 năm, codes: [breakeven_10y], range: 5Y}
    - {group: A5, title: VIX, codes: [vix], range: 5Y}
    - {group: A5, title: Lãi vay mua nhà Mỹ 30 năm, codes: [us_mortgage_30y], range: 10Y}
vietnam:
  charts:
    - {group: B1, title: Tăng trưởng GDP so cùng kỳ (số công bố), codes: [gdp_yoy_published], range: 10Y, kind: bar, show_target: true}
    - {group: B1, title: PMI sản xuất, codes: [pmi_vn], range: 5Y}
    - {group: B2, title: Lạm phát so cùng kỳ, codes: [cpi_yoy, cpi_housing_yoy], range: 5Y}
    - {group: B2, title: CPI bình quân từ đầu năm so mục tiêu, codes: [cpi_avg_ytd], range: 5Y, show_target: true}
    - {group: B2, title: Tỷ giá trung tâm USD/VND, codes: [fx_central], range: 5Y}
    - {group: B3, title: Lãi suất huy động 12 tháng, codes: [deposit_12m_big4, deposit_12m_all], range: 5Y}
    - {group: B3, title: Lãi suất điều hành và liên ngân hàng, codes: [refi_rate, interbank_on], range: 5Y}
    - {group: B3, title: Lợi suất TPCP 10 năm, codes: [govbond_10y], range: 5Y}
    - {group: B4, title: Tín dụng và M2 từ đầu năm, codes: [credit_ytd, m2_ytd], range: 5Y}
    - {group: B4, title: Tín dụng ngành Xây dựng từ đầu năm, codes: [credit_construction_ytd], range: 5Y}
    - {group: B4, title: Tăng trưởng tín dụng và M2 so cùng kỳ, codes: [credit_level, m2_level], range: 10Y, transform: yoy}
    - {group: B4, title: Dư nợ tín dụng / M2 (đại diện LDR), codes: [credit_to_m2], range: 10Y}
    - {group: B4, title: Cán cân thương mại hàng hóa (triệu USD/tháng), codes: [trade_balance], range: 5Y, kind: bar}
    - {group: C1, title: Thu tiền sử dụng đất, codes: [land_use_revenue], range: ALL, kind: bar}
    - {group: D2, title: Giải ngân đầu tư công theo tháng, codes: [public_investment], range: 5Y, kind: bar}
    - {group: D2, title: Đầu tư công lũy kế so cùng kỳ, codes: [public_investment_ytd_yoy], range: 5Y}
    - {group: E1, title: Vốn FDI đăng ký cấp mới (lũy kế năm), codes: [fdi_registered_ytd], range: 5Y, kind: bar}
  sample:
    - {title: Tăng trưởng tín dụng, codes: [credit_yoy, credit_ytd], range: 10Y}
    - {title: Lãi suất thực Việt Nam so với lãi suất Fed, codes: [real_rate, effr], range: 10Y}
  derived:
    - {title: Lãi suất thực (huy động 12T Big4 − CPI), codes: [real_rate], range: 10Y}
    - {title: Tín dụng trừ M2 (từ đầu năm), codes: [credit_minus_m2], range: 10Y, kind: bar}
    - {title: CPI Nhà ở & VLXD so CPI chung, codes: [cpi_yoy, cpi_housing_yoy], range: 10Y}
