  - 5.5
  side: above
  description: 'Lạm phát VN so cùng kỳ: cao → VND mất sức mua thực → áp lực mất giá
    VND (ngang giá sức mua). Trọng số thấp vì tác động ngắn hạn yếu (VECM 2005–2017).
    [giả định] Chờ QTRR duyệt.'
