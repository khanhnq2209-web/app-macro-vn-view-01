name: Tỷ giá
order: 1
description: 'Áp lực mất giá VND 3–12 tháng tới (điểm thấp = áp lực cao). Khung EMP
  (Eichengreen–Rose–Wyplosz): biến động tỷ giá + chênh lệch lãi suất; IMF 2024–25:
  VND mất giá 5% năm 2024 dù thặng dư vãng lai, do chênh lệch lãi với USD. Thiếu dự
  trữ, tỷ giá NHTM, cán cân thương mại: cần nguồn mới.'
meaning: Bất lợi = 3–12 tháng tới tỷ giá USD/VND có xu hướng TĂNG (VND mất giá). Thuận
  lợi = tỷ giá ổn định hoặc GIẢM.
rating_bands:
- min: 1.0
  label: Rất thuận lợi
- min: 0.45
  label: Thuận lợi
- min: -0.25
  label: Trung tính
- min: -0.7
  label: Bất lợi
- min: -99
  label: Rất bất lợi
rows:
- code: rate_diff_vnd_usd
  pillar: Chênh lệch lãi suất
  method: absolute
  cuts:
  - -1.29
  - -0.16
  - 1.14
  - 2.38
  side: below
  description: 'Lãi qua đêm VND − EFFR, trung bình 20 phiên: âm → giữ USD có lãi hơn
    → cầu USD tăng (giữa 2023 lãi USD cao hơn VND 3–3,5%, ACBS; IMF Article IV 2024,
    2025). [giả định] Chờ QTRR duyệt.'
  measure:
    kind: mean
    n: 20
    unit: period
- code: usd_broad
  pillar: USD và Fed
  method: absolute
  cuts:
  - -3.28
  - -1.15
  - 1.34
  - 3.83
  side: above
  description: '% thay đổi USD (rổ rộng, có CNY) 3 tháng: USD mạnh → vốn rút khỏi
    thị trường mới nổi. Dùng rổ rộng thay DXY vì VND gần như không nhạy với DXY (MUFG).
    [giả định] Chờ QTRR duyệt.'
  measure:
    kind: pct_change
    n: 91
    unit: day
- code: fedwatch_12m
  pillar: USD và Fed
  method: absolute
  cuts:
  - -50.0
  - -12.5
  - 12.5
  - 50.0
  side: above
  description: 'Kỳ vọng thị trường (CME FedWatch) cho lãi Fed 12 tháng tới so với
    hiện tại, bps: dự báo tăng ≥ 2 bước 25 bps là rất xấu, tăng 1 bước là xấu, giảm
    là tốt. Fed tăng → lãi USD cao hơn → áp lực tỷ giá → NHNN khó hạ lãi (IMF 2024–25).
    [giả định] Chờ QTRR duyệt.'
- code: ust_2y
  pillar: USD và Fed
  info: true
  method: absolute
  cuts:
  - -0.5
  - -0.08
  - 0.29
  - 0.66
  side: above
  description: 'Tham khảo, không tính điểm: đã có kỳ vọng Fed trực tiếp từ FedWatch.'
  measure:
    kind: change
    n: 91
    unit: day
- code: fx_vcb
  pillar: Biến động tỷ giá
  method: absolute
  cuts:
  - -0.25
  - 0.25
  - 1.0
  - 2.0
  side: above
  description: '% thay đổi giá bán USD tại Vietcombank 3 tháng: giá thị trường, sát
    hơn tỷ giá trung tâm (NHNN chủ động dời tâm từ 2025, IMF). Mốc theo chuẩn chuyên
    gia: VND mất giá 2–4%/năm là bình thường (UOB, VnEconomy 2026) → 0,25–1%/3 tháng
    trung tính, 1–2% xấu, trên 2% rất xấu. [giả định] Chờ QTRR duyệt.'
  measure:
    kind: pct_change
    n: 91
    unit: day
