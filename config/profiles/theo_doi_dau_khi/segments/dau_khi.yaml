name: Dầu, khí đốt
order: 1
description: 'Áp lực tăng giá năng lượng VN phải trả 3–6 tháng tới (điểm thấp = áp
  lực cao). Giá xăng dầu VN điều hành hằng tuần theo giá thế giới (NĐ 80/2023); giao
  thông 9,98% rổ CPI. Thiếu tồn kho dầu, độ dốc đường giá kỳ hạn, công suất dư OPEC
  (EIA): cần API EIA.'
