  method: absolute
  cuts:
  - -25.0
  - -10.0
  - 10.0
  - 25.0
  side: below
  description: FDI đăng ký, tổng 12 tháng so cùng kỳ, dẫn trước cầu thuê đất 6–18
    tháng. Lịch sử đủ 12 tháng chỉ từ 12/2023 nên mốc rộng.
