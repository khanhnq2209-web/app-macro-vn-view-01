  - 87.9
  side: above
  description: 'Dư nợ tín dụng / M2, đại diện LDR: cao → ngân hàng cho vay vượt nguồn
    huy động → thiếu thanh khoản, lãi suất khó giảm (Workshop BĐS 10/2026, trang 10–11).
    Mốc = phân vị 10/30/70/90 của 10 năm. [giả định] Chờ QTRR duyệt.'
