- code: public_investment_plan_pace
  pillar: Hạ tầng
  method: absolute
  cuts:
  - -15.0
  - -10.0
  - -5.0
  - 0.0
  side: below
  description: '% kế hoạch năm đã thực hiện trừ % thời gian đã trôi (tháng/12). Vd
    9 tháng đạt 64% KH → 64 − 75 = −11 điểm % (chậm). Từ 0 trở lên là đúng hoặc nhanh
    hơn tiến độ; dưới −15 là chậm nhiều. Chỉ tính cho năm có kế hoạch trong bản đồ
    Kế hoạch & dự báo.'
