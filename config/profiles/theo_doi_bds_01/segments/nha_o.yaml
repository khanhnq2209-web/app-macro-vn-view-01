name: Nhà ở
order: 1
description: 'Điều kiện vĩ mô cho thị trường nhà ở VN 6–12 tháng tới. Cú sốc chính
  2022–23 là lãi suất và kênh vốn (IMF 2023, 2025). Thiếu tín dụng BĐS, trái phiếu
  doanh nghiệp BĐS: cần nguồn mới.'
meaning: Bất lợi = 6–12 tháng tới lãi vay mua nhà có xu hướng TĂNG, giao dịch nhà
  ở có xu hướng GIẢM. Thuận lợi = ngược lại.
rating_bands:
- min: 1.05
  label: Rất thuận lợi
- min: 0.6
  label: Thuận lợi
- min: 0.15
  label: Trung tính
- min: -0.2
  label: Bất lợi
- min: -99
  label: Rất bất lợi
rows:
- code: deposit_12m_big4
  pillar: Lãi suất và thanh khoản
  method: absolute
  cuts:
  - -0.5
  - -0.15
  - 0.15
  - 0.75
  side: above
  description: 'Thay đổi lãi huy động 12T Big4 trong 12 tháng (điểm %): dẫn lãi vay
    mua nhà; Q4/2022 LS 12T lên 9,5–11,5% (The Investor). Mốc ±0,15 để tránh mốc đúng
    bằng 0. [giả định] Chờ QTRR duyệt.'
  measure:
    kind: change
    n: 1
    unit: year
