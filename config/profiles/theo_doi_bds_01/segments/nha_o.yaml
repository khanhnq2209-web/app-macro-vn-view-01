  pillar: Lãi suất và thanh khoản
  method: absolute
  cuts:
  - 2.0
  - 3.0
  - 4.0
  - 5.0
  side: above
  description: 'Lãi qua đêm liên ngân hàng, trung bình 20 phiên: thanh khoản hệ thống,
    dẫn lãi huy động. [giả định] Chờ QTRR duyệt.'
  measure:
    kind: mean
    n: 20
    unit: period
- code: refi_rate
  pillar: Lãi suất và thanh khoản
  method: absolute
  cuts:
  - -1.0
  - -0.25
  - 0.25
  - 1.0
  side: above
  description: 'Thay đổi lãi tái cấp vốn 12 tháng: hướng chính sách NHNN (tăng 2×100bp
    9–10/2022, giảm về 4,5% 6/2023). Đo thay đổi vì mức đứng yên nhiều năm. [giả định]
    Chờ QTRR duyệt.'
  measure:
    kind: change
    n: 1
    unit: year
- code: fedwatch_12m
  pillar: Lãi suất và thanh khoản
  method: absolute
  cuts:
  - -50.0
  - -12.5
  - 12.5
  - 50.0
  side: above
  description: 'Kỳ vọng thị trường (CME FedWatch) cho lãi Fed 12 tháng tới so với
    hiện tại, bps: dự báo tăng ≥ 2 bước 25 bps là rất xấu, tăng 1 bước là xấu, giảm
    là tốt. Fed tăng → lãi USD cao hơn → áp lực tỷ giá → NHNN khó hạ lãi (IMF 2024–25).
    [giả định] Chờ QTRR duyệt.'
- code: credit_yoy
  pillar: Tín dụng
  method: absolute
  cuts:
  - 8.0
  - 11.0
  - 16.0
  - 20.0
  side: both
  description: 'Tăng trưởng tín dụng so cùng kỳ, chấm hai chiều: 11–16% là tốt; dưới
    8% (vốn cạn) hoặc trên 20% (quá nóng, NHNN sắp siết room) là xấu (IMF 2025: tín
    dụng/GDP 136%). [giả định] Chờ QTRR duyệt.'
